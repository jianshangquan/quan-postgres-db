syntax = "proto3";

package storage.v1;

service Storage {
  rpc CreateTimeline(CreateTimelineRequest) returns (CreateTimelineResponse);
  rpc AppendWAL(AppendWALRequest) returns (AppendWALResponse);
  rpc GetPage(GetPageRequest) returns (GetPageResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc IngestWAL(IngestWALRequest) returns (IngestWALResponse);
}

message CreateTimelineRequest {
  string tenant_id = 1;
  string timeline_id = 2;
}

message CreateTimelineResponse {
  string tenant_id = 1;
  string timeline_id = 2;
}

message AppendWALRequest {
  string tenant_id = 1;
  string timeline_id = 2;
  uint64 start_lsn = 3;
  uint64 end_lsn = 4;
  bytes payload = 5;
}

message AppendWALResponse {
  uint64 ack_lsn = 1;
  string leader_addr = 2;
}

message GetPageRequest {
  string tenant_id = 1;
  string timeline_id = 2;
  uint32 rel_filenode = 3;
  uint32 fork = 4;
  uint32 block = 5;
  uint64 request_lsn = 6;
}

message GetPageResponse {
  bytes page = 1;
  uint64 lsn = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  string role = 1;
  string node_id = 2;
  bool is_leader = 3;
  string leader_addr = 4;
  uint64 last_lsn = 5;
}

message IngestWALRequest {
  string tenant_id = 1;
  string timeline_id = 2;
  uint64 start_lsn = 3;
  uint64 end_lsn = 4;
  bytes payload = 5;
}

message IngestWALResponse {
  uint64 applied_lsn = 1;
}

// Internal Raft RPCs between safekeepers
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
  string leader_grpc_addr = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}
