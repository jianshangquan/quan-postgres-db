services:
  pageserver:
    build:
      context: ./pageserver
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      LISTEN_ADDR: ":8081"
      DATA_DIR: /data
    volumes:
      - ./data/pageserver:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  safekeeper:
    build:
      context: ./safekeeper
      dockerfile: Dockerfile
    ports:
      - "5454:5454"
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":5454"
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      PAGESERVER_URL: http://pageserver:8081
    volumes:
      - ./data/safekeeper:/data
    depends_on:
      pageserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  compute:
    build:
      context: .
      dockerfile: compute/Dockerfile
    ports:
      - "5432:5432"
    environment:
      PAGESERVER_HTTP: http://pageserver:8081
      QUAN_ENABLE_GETPAGE: "1"
      QUAN_PAGESERVER_HTTP: http://pageserver:8081
      SAFEKEEPER_ADDR: safekeeper:5454
      SAFEKEEPER_HTTP: http://safekeeper:8080
      TENANT_ID: default
      TIMELINE_ID: main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      PGURL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      QUAN_EXTERNAL_WALSTREAMER: "1"
    volumes:
      - ./data/compute:/var/lib/postgresql/data
      - ./compute/scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    depends_on:
      pageserver:
        condition: service_healthy
      safekeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/.quan_compute_ready && pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  walstreamer:
    build:
      context: ./walstreamer
      dockerfile: Dockerfile
    environment:
      PGDATA: /var/lib/postgresql/data
      SAFEKEEPER_ADDR: safekeeper:5454
      TENANT_ID: default
      TIMELINE_ID: main
      PGURL: postgres://postgres:postgres@compute:5432/postgres?sslmode=disable
      PSQL: psql
    volumes:
      - ./data/compute:/var/lib/postgresql/data:ro
    depends_on:
      compute:
        condition: service_healthy
      safekeeper:
        condition: service_healthy
    restart: unless-stopped
