services:
  pageserver:
    build:
      context: ./pageserver
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      LISTEN_ADDR: ":8081"
      DATA_DIR: /data
      QUAN_STORAGE_TOKEN: ${QUAN_STORAGE_TOKEN:?set QUAN_STORAGE_TOKEN in .env}
      CACHE_PAGES: "8192"
      PAGESERVER_ROLE: primary
      PAGESERVER_PEER_URLS: https://pageserver-2:8081
      SAFEKEEPER_HTTP_URLS: https://safekeeper-1:8080,https://safekeeper-2:8080,https://safekeeper-3:8080
      TENANT_ID: ${TENANT_ID:-default}
      TIMELINE_ID: ${TIMELINE_ID:-main}
      TLS_CERT_FILE: /certs/pageserver.crt
      TLS_KEY_FILE: /certs/pageserver.key
      TLS_CA_FILE: /certs/ca.crt
      QUAN_TLS_CA: /certs/ca.crt
    volumes:
      - ./data/pageserver:/data
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:8081/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  pageserver-2:
    build:
      context: ./pageserver
      dockerfile: Dockerfile
    ports:
      - "8082:8081"
    environment:
      LISTEN_ADDR: ":8081"
      DATA_DIR: /data
      QUAN_STORAGE_TOKEN: ${QUAN_STORAGE_TOKEN:?set QUAN_STORAGE_TOKEN in .env}
      CACHE_PAGES: "8192"
      PAGESERVER_ROLE: replica
      SAFEKEEPER_HTTP_URLS: https://safekeeper-1:8080,https://safekeeper-2:8080,https://safekeeper-3:8080
      TENANT_ID: ${TENANT_ID:-default}
      TIMELINE_ID: ${TIMELINE_ID:-main}
      TLS_CERT_FILE: /certs/pageserver-2.crt
      TLS_KEY_FILE: /certs/pageserver-2.key
      TLS_CA_FILE: /certs/ca.crt
      QUAN_TLS_CA: /certs/ca.crt
    volumes:
      - ./data/pageserver-2:/data
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:8081/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  safekeeper-1:
    build:
      context: ./safekeeper
      dockerfile: Dockerfile
    ports:
      - "5454:5454"
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":5454"
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      QUAN_STORAGE_TOKEN: ${QUAN_STORAGE_TOKEN:?set QUAN_STORAGE_TOKEN in .env}
      SAFEKEEPER_PEERS: https://safekeeper-2:8080,https://safekeeper-3:8080
      TLS_CERT_FILE: /certs/safekeeper-1.crt
      TLS_KEY_FILE: /certs/safekeeper-1.key
      TLS_CA_FILE: /certs/ca.crt
      QUAN_TLS_CA: /certs/ca.crt
    volumes:
      - ./data/safekeeper-1:/data
      - ./certs:/certs:ro
    networks:
      default:
        aliases:
          - safekeeper
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  safekeeper-2:
    build:
      context: ./safekeeper
      dockerfile: Dockerfile
    ports:
      - "5455:5454"
      - "8083:8080"
    environment:
      LISTEN_ADDR: ":5454"
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      QUAN_STORAGE_TOKEN: ${QUAN_STORAGE_TOKEN:?set QUAN_STORAGE_TOKEN in .env}
      SAFEKEEPER_PEERS: https://safekeeper-1:8080,https://safekeeper-3:8080
      TLS_CERT_FILE: /certs/safekeeper-2.crt
      TLS_KEY_FILE: /certs/safekeeper-2.key
      TLS_CA_FILE: /certs/ca.crt
      QUAN_TLS_CA: /certs/ca.crt
    volumes:
      - ./data/safekeeper-2:/data
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  safekeeper-3:
    build:
      context: ./safekeeper
      dockerfile: Dockerfile
    ports:
      - "5456:5454"
      - "8084:8080"
    environment:
      LISTEN_ADDR: ":5454"
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      QUAN_STORAGE_TOKEN: ${QUAN_STORAGE_TOKEN:?set QUAN_STORAGE_TOKEN in .env}
      SAFEKEEPER_PEERS: https://safekeeper-1:8080,https://safekeeper-2:8080
      TLS_CERT_FILE: /certs/safekeeper-3.crt
      TLS_KEY_FILE: /certs/safekeeper-3.key
      TLS_CA_FILE: /certs/ca.crt
      QUAN_TLS_CA: /certs/ca.crt
    volumes:
      - ./data/safekeeper-3:/data
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  compute:
    build:
      context: .
      dockerfile: compute/Dockerfile
    ports:
      - "5432:5432"
    environment:
      PAGESERVER_HTTP: https://pageserver:8081
      QUAN_ENABLE_GETPAGE: "1"
      QUAN_PAGESERVER_HTTP: https://pageserver:8081
      QUAN_PAGESERVER_HTTP_URLS: https://pageserver:8081,https://pageserver-2:8081
      QUAN_STORAGE_TOKEN: ${QUAN_STORAGE_TOKEN:?set QUAN_STORAGE_TOKEN in .env}
      QUAN_TLS_CA: /certs/ca.crt
      TLS_CA_FILE: /certs/ca.crt
      SAFEKEEPER_ADDR: safekeeper-1:5454
      SAFEKEEPER_ADDRS: safekeeper-1:5454,safekeeper-2:5454,safekeeper-3:5454
      SAFEKEEPER_HTTP: https://safekeeper-1:8080
      SAFEKEEPER_HTTP_SEEDS: https://safekeeper-1:8080,https://safekeeper-2:8080,https://safekeeper-3:8080
      QUORUM: ${QUORUM:-2}
      TENANT_ID: ${TENANT_ID:-default}
      TIMELINE_ID: ${TIMELINE_ID:-main}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      PGURL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@127.0.0.1:5432/postgres?sslmode=disable
      QUAN_EXTERNAL_WALSTREAMER: "1"
    volumes:
      - ./data/compute:/var/lib/postgresql/data
      - ./compute/scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./certs:/certs:ro
    depends_on:
      pageserver:
        condition: service_healthy
      pageserver-2:
        condition: service_healthy
      safekeeper-1:
        condition: service_healthy
      safekeeper-2:
        condition: service_healthy
      safekeeper-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/.quan_compute_ready && pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  walstreamer:
    build:
      context: ./walstreamer
      dockerfile: Dockerfile
    environment:
      PGDATA: /var/lib/postgresql/data
      SAFEKEEPER_ADDRS: safekeeper-1:5454,safekeeper-2:5454,safekeeper-3:5454
      QUORUM: ${QUORUM:-2}
      QUAN_STORAGE_TOKEN: ${QUAN_STORAGE_TOKEN:?set QUAN_STORAGE_TOKEN in .env}
      QUAN_TLS_CA: /certs/ca.crt
      TLS_CA_FILE: /certs/ca.crt
      TENANT_ID: ${TENANT_ID:-default}
      TIMELINE_ID: ${TIMELINE_ID:-main}
      PGURL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@compute:5432/postgres?sslmode=disable
      PSQL: psql
    volumes:
      - ./data/compute:/var/lib/postgresql/data:ro
      - ./certs:/certs:ro
    depends_on:
      compute:
        condition: service_healthy
      safekeeper-1:
        condition: service_healthy
      safekeeper-2:
        condition: service_healthy
      safekeeper-3:
        condition: service_healthy
    restart: unless-stopped
